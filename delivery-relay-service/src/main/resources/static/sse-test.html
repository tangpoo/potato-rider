<!DOCTYPE html>
<html>
<head>
  <title>SSE Test</title>
</head>
<body>
<h1>SSE Test</h1>
<div id="sse-output"></div>
<script>
  async function connectSSE() {
    const response = await fetch('http://localhost:8090/api/v1/relay/stream', {
      headers: {
        'Last-Event-ID': '', // 필요에 따라 설정
        'Receiver-ID': 'string' // 실제 receiverId로 변경
      }
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    const output = document.getElementById('sse-output');

    while (true) {
      const {done, value} = await reader.read();
      if (done) {
        break;
      }
      const text = decoder.decode(value);
      const newElement = document.createElement('div');
      newElement.textContent = 'Data: ' + text;
      output.appendChild(newElement);
    }
  }

  connectSSE().catch(error => {
    const output = document.getElementById('sse-output');
    const newElement = document.createElement('div');
    newElement.textContent = 'Error: ' + error;
    output.appendChild(newElement);
  });
</script>
</body>
</html>
